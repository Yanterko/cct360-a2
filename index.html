<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Wear</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="titleSection">
        <h1>Weather Wear</h1>
        <img id="snowflake" src="images/Snowflake.svg" alt="image of a snowflake">
    </div>

    <h3 class="instruction">Click the button to get an outfit recommendation based on the current weather!</h3>
    <button type="button" id="recommendbtn">Get Outfit Recommendation</button>

    <div class="frame_notyet">
        <div id="outfitcontainer" hidden>
            <p id="recommendation"></p>
        </div>
    </div>

    <h3 class="instruction">Current Weather:</h3>
    
    <div class="style_frame">
        <div id="weather-div">
            <div class="weather_column">
                <p class="temp_text">Temperature:</p>
                <p id="weather-slot-1"></p>
                <p class="temp_text">Feels Like:</p>
                <p id="weather-slot-2"></p>
            </div>
            <div class="weather_column">
                <p class="temp_text">Rain:</p>
                <p id="weather-slot-3"></p>
                <p class="temp_text">Snow:</p>
                <p id="weather-slot-4"></p>
            </div>
            <div class="weather_column" id="image_column">
                <img id="weather_img" src="images/Rain.svg" alt="rain">
            </div>
        </div>
    </div>

    <audio id="bell" src="images/Bell.mp3" type="audio/mpeg" autoplay></audio>
    <br>

    <p class="instruction">*all illustrations and photos made by the team</p>
    

    <script src="main.js"></script>
</body>
</html>
