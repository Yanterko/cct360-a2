<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Wear</title>
    <link rel="stylesheet" href="style.css">
    <!--Fonts:-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&display=swap" rel="stylesheet">
</head>
<body>
    
    <div id="titleSection">
        <h1>Weather Wear</h1>
        <img id="snowflake" src="images/Snowflake.svg" alt="image of a snowflake">
    </div>

    <h3 id="instruction">Click the button to get an outfit recommendation based on the current weather!</h3>
    <button type="button" id="recommendbtn">Get Outfit Recommendation</button>

    <div class="frame_notyet">
        <div id="outfitcontainer">
            <p id="recommendation"></p>
        </div>
    </div>

    <h3 id="instruction">Current Weather:</h3>
    
    <div class="style_frame">
        <div id="weather-div">
            <div class="weather_column">
                <p id="slot-1"></p>
                <p id="slot-2"></p>
            </div>
            <div class="weather_column">
                <p id="slot-3"></p>
                <p id="slot-4"></p>
            </div>
            <div class="weather_column" id="image_column">
                <img id="weather_img" src="images/Rain.svg" alt="rain">
            </div>
        </div>
    </div>
    <br>
    

    <script src="main.js"></script>
</body>
</html>
