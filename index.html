<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Wear</title>
    <link rel="stylesheet" href="style.css">
    <!--Fonts:-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&display=swap" rel="stylesheet">

<body>
    <h1>Weather Wear</h1>

    <h3 id="instruction">Click the button to get an outfit recommendation based on the current weather!</h3>
    <button type="button" id="recommendbtn">Get Outfit Recommendation</button>

    <div id="outfitcontainer">
        <p id="recommendation"></p>

    </div>


    <h3 id="instruction">Current Weather:</h3>
    <div id="weather-div">
        <p id="slot-1"></p>
        <p id="slot-2"></p>
        <p id="slot-3"></p>
        <p id="slot-4"></p>
    </div>
    <br>
    

    <script src="main.js"></script>
</body>
